name: Continuous Integration

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: 🧪 Lint, Unit Tests & Build Verification
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Djava.awt.headless=true -Dfile.encoding=UTF-8"
      JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🛠️ Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔐 Configure Environment
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY || '' }}" > .env
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi

      - name: 🐘 Grant Execute Permission for Gradle
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: 🧪 Run Local Unit Tests
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew testDebugUnitTest --no-daemon --stacktrace
          else
            gradle testDebugUnitTest --no-daemon --stacktrace
          fi

      - name: 🏗️ Assemble Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: 📤 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitPulse-CI-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
